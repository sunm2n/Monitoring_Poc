# ─────────────────────────────────────────────────────────────────────────────
# 오버라이드: api 의 로깅 드라이버를 fluentd → json-file 로 되돌린다.
#
# 쓰는 곳은 두 군데다.
#
# 1) Phase 3 검증 — "앱이 한 줄짜리 JSON 을 제대로 뱉는가"를 확인할 때.
#    fluentd 드라이버가 붙어 있으면 `docker compose logs api` 가 아예 동작하지 않는다
#    (Docker CLI 는 json-file / local 드라이버만 읽을 수 있다).
#
# 2) Phase 6-A 검증 — "컨테이너가 죽으면 로그도 같이 죽는다"를 보여줄 때.
#    이 모드로 로그를 쌓고 `docker compose rm -sf api` 하면 그 로그는 흔적도 없이 사라진다.
#    같은 시각의 로그가 Dashboards 에는 그대로 남아 있는 화면과 나란히 놓으면,
#    "로그 시스템이 왜 필요한가"에 대한 설명이 한 장으로 끝난다.
#
# 사용:
#   docker compose -f docker-compose.yml -f docker-compose.stdout.yml up -d api
#   docker compose logs -f api
#
# 원래대로 되돌리기:
#   docker compose up -d --force-recreate api
# ─────────────────────────────────────────────────────────────────────────────

services:
  api:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
