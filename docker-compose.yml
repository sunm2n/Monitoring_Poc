# ─────────────────────────────────────────────────────────────────────────────
# OpenSearch 로그 수집 PoC
#
# 기동 순서가 이 파일의 핵심이다.
#
#   opensearch ──(healthy)──▶ os-setup ──(완료)──▶ fluent-bit ──▶ api
#                    └──────▶ dashboards
#   mssql ──(healthy)──▶ mssql-init ──(완료)──▶ api
#
# os-setup 이 "완료"된 뒤에야 fluent-bit 이 뜨는 이유:
#   인덱스 템플릿은 Fluent Bit 이 첫 문서를 보내기 전에 등록돼야 한다.
#   먼저 문서가 들어가버리면 company_id 가 text 로 자동 매핑되고, 그 순간 DLS 가 죽는다.
#   (함정 #3 — 이 PoC에서 가장 조용하고 치명적인 실패)
# ─────────────────────────────────────────────────────────────────────────────

name: monitoring-poc

services:
  # ───────────────────────────────────────────────────────────────────────────
  # OpenSearch — Security 플러그인 ON. 절대 끄지 않는다.
  # Security 를 끄면 이 PoC 목적의 절반(회사별 권한 분리)이 통째로 사라진다.
  # ───────────────────────────────────────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:3.1.0
    container_name: poc-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS}
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      # 단일 노드라 디스크 워터마크에 걸리면 인덱스가 read-only 로 잠긴다.
      # 개발 PC 디스크가 꽉 차 있을 때 "로그가 갑자기 안 들어옴" 으로 나타나므로 미리 풀어둔다.
      - cluster.routing.allocation.disk.threshold_enabled=false
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "9200:9200"
    volumes:
      - os-data:/usr/share/opensearch/data
    healthcheck:
      # Security 가 켜져 있으므로 https + 인증이 필요하다. -k 는 데모 인증서(self-signed) 때문.
      test:
        [
          "CMD-SHELL",
          "curl -sf -k -u admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD} https://localhost:9200/_cluster/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ───────────────────────────────────────────────────────────────────────────
  # 인덱스 템플릿 + 테넌트/역할/사용자 구성 (1회성)
  # 컨테이너를 갈아엎을 때마다 30초 안에 권한 구성이 재현되는 것이 목적.
  # UI 클릭으로 구성하면 PoC 시간을 전부 여기서 잡아먹는다.
  # ───────────────────────────────────────────────────────────────────────────
  os-setup:
    image: curlimages/curl:latest
    container_name: poc-os-setup
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      - OPENSEARCH_HOST=https://opensearch:9200
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      - COMPANY1_ADMIN_PASSWORD=${COMPANY1_ADMIN_PASSWORD}
      - COMPANY2_ADMIN_PASSWORD=${COMPANY2_ADMIN_PASSWORD}
      - CONFIG_DIR=/config
    volumes:
      - ./opensearch:/config:ro
    entrypoint: ["sh", "/config/setup-security.sh"]
    restart: "no"

  # ───────────────────────────────────────────────────────────────────────────
  # Dashboards — admin / company1_admin / company2_admin 로 로그인해 격리를 눈으로 확인한다.
  # ───────────────────────────────────────────────────────────────────────────
  dashboards:
    image: opensearchproject/opensearch-dashboards:3.1.0
    container_name: poc-dashboards
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      - 'OPENSEARCH_HOSTS=["https://opensearch:9200"]'
      # Dashboards 가 OpenSearch 에 붙을 때 쓰는 내부 서비스 계정.
      # 데모 설정에 포함된 계정으로, 사용자 로그인 계정과는 무관하다.
      - OPENSEARCH_USERNAME=kibanaserver
      - OPENSEARCH_PASSWORD=kibanaserver
      - OPENSEARCH_SSL_VERIFICATIONMODE=none
    ports:
      - "5601:5601"

  # ───────────────────────────────────────────────────────────────────────────
  # MSSQL — 실제 제품 전제와 동일하게 맞춘다.
  # Apple Silicon 에서는 amd64 에뮬레이션으로 돈다 (Rosetta 권장). 기동에 20~40초.
  # ───────────────────────────────────────────────────────────────────────────
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: poc-mssql
    platform: linux/amd64
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=Developer
      # 에뮬레이션 환경에서 메모리를 과하게 잡지 않도록 상한을 둔다.
      - MSSQL_MEMORY_LIMIT_MB=2048
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # -C : 서버 인증서 신뢰 (mssql-tools18 은 기본이 암호화 강제라 없으면 연결 실패)
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' -b -o /dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

  # ───────────────────────────────────────────────────────────────────────────
  # Fluent Bit — 수집기. Logstash 대신 쓴 이유는 리소스(1/10) 때문.
  # OpenSearch + Dashboards + MSSQL 이 이미 떠 있는 개발 PC에 JVM 을 하나 더 올릴 이유가 없다.
  # ───────────────────────────────────────────────────────────────────────────
  fluent-bit:
    image: fluent/fluent-bit:4.1
    container_name: poc-fluent-bit
    depends_on:
      os-setup:
        condition: service_completed_successfully
    environment:
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    volumes:
      - ./fluent-bit:/fluent-bit/etc:ro

  # ───────────────────────────────────────────────────────────────────────────
  # API — 이 컨테이너에는 OpenSearch 관련 코드가 단 한 줄도 없다.
  # stdout 에 JSON 을 뱉을 뿐이고, 그걸 누가 어디로 가져가는지는 앱의 관심사가 아니다.
  # (PoC 주장 4 — 백엔드를 Loki 든 뭐든 갈아끼울 수 있다는 증거)
  # ───────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
    container_name: poc-api
    depends_on:
      mssql:
        condition: service_healthy
      fluent-bit:
        condition: service_started
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__PocDb=Server=mssql,1433;Database=PocDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      # 스키마/시드 스크립트. 소유권은 SQL 파일에 있고 API 는 실행기일 뿐이다.
      # 별도 init 컨테이너를 쓰지 않는 이유는 api/Data/DatabaseInitializer.cs 주석 참조.
      - SEED_SQL_PATH=/db-init/01-seed.sql
    volumes:
      - ./db/init:/db-init:ro
    ports:
      - "8080:8080"
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        # ★ 이게 빠지면 지옥을 본다.
        #   async 가 꺼져 있으면 수집기가 안 떠 있을 때 api 컨테이너가 아예 시작조차 못 한다.
        #   async 를 켜면 수집기가 죽어도 앱은 정상 동작하고 로그만 버려진다.
        #   이게 프로덕션에서도 올바른 동작이다 — 로그 시스템 장애가 앱 장애로 전파되면 안 된다.
        fluentd-async: "true"
        tag: poc.api

volumes:
  os-data:
  mssql-data:
