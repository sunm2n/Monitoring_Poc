# ─────────────────────────────────────────────────────────────────────────────
# 오버레이: Loki + Grafana 를 추가하고, Fluent Bit 이 두 백엔드로 동시에 보내게 한다.
#
#   docker compose -f docker-compose.yml -f docker-compose.loki.yml up -d
#
# 기본 구성(docker-compose.yml)은 손대지 않는다. 이 파일을 빼면 OpenSearch 단독 구성으로
# 그대로 돌아간다.
#
# ── 스위칭이 아니라 병렬로 붙인 이유 ─────────────────────────────────────────
# 같은 INPUT 을 두 OUTPUT 으로 fan-out 하면 **완전히 동일한 로그 스트림**을 두 백엔드가
# 받는다. 스위칭 방식이면 "OpenSearch 로 찍은 시간대"와 "Loki 로 찍은 시간대"가 달라져서
# 같은 사건을 두 UI 에서 나란히 놓고 비교할 수 없다.
# 리소스는 더 들지만, 비교가 목적이라면 이쪽이 맞다.
# ──────────────────────────────────────────────────────────────────────────

services:
  # ───────────────────────────────────────────────────────────────────────────
  # Loki — 단일 바이너리 모드. 이미지 기본 설정(/etc/loki/local-config.yaml)을 그대로 쓴다.
  #
  # 기본 설정은 auth_enabled: false 다. 즉 멀티테넌시가 꺼져 있고 모든 로그가
  # "fake" 라는 단일 테넌트로 들어간다. 이건 실수가 아니라 의도다 —
  # PoC 목적이 "Loki 로 회사별 권한 분리가 되는가"를 정직하게 보는 것이기 때문이다.
  # (docs/loki-comparison.md 참조)
  # ───────────────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.5.1
    container_name: poc-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ───────────────────────────────────────────────────────────────────────────
  # Grafana — Loki 데이터소스를 프로비저닝으로 미리 꽂아둔다.
  # UI 에서 데이터소스를 손으로 등록하는 단계를 없애기 위한 것이고,
  # OpenSearch 쪽 setup-security.sh 와 같은 발상이다.
  # ───────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:12.0.0
    container_name: poc-grafana
    depends_on:
      loki:
        condition: service_healthy
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      # 플러그인 다운로드 시도를 막아 오프라인에서도 기동되게 한다.
      - GF_INSTALL_PLUGINS=
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

  # ───────────────────────────────────────────────────────────────────────────
  # Fluent Bit — 설정 파일만 갈아끼운다. 이미지도 그대로다.
  # fluent-bit-loki.conf 가 fluent-bit.conf 를 @INCLUDE 하고 Loki OUTPUT 만 덧붙인다.
  #
  # 이미지의 ENTRYPOINT 가 /fluent-bit/bin/fluent-bit 이므로 command 에는 인자만 준다.
  # ───────────────────────────────────────────────────────────────────────────
  fluent-bit:
    command: ["-c", "/fluent-bit/etc/fluent-bit-loki.conf"]
    depends_on:
      os-setup:
        condition: service_completed_successfully
      loki:
        condition: service_healthy

volumes:
  loki-data:
  grafana-data:
