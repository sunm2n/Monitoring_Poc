# =============================================================================
# parsers.conf
# -----------------------------------------------------------------------------
# 여기서 정의하는 파서는 fluent-bit.conf 의 [FILTER] parser 섹션에서
# `Parser app_json` 으로 참조된다.
#
# 대상 데이터: .NET API 컨테이너가 stdout 에 찍는 한 줄짜리 JSON
#   (필드 정의는 /Users/sunm2n/Desktop/Poc/monitoringPoc/docs/log-schema.md 참조)
# 이 JSON은 Docker의 fluentd 로깅 드라이버에 의해 다시 `{"log": "<그 JSON 문자열>", ...}`
# 형태로 한 번 더 감싸져서 Forward 프로토콜로 넘어온다. 그래서 이 파서는
# fluent-bit.conf 쪽에서 `log` 필드의 "값"에 대해서만 적용된다 (Key_Name log).
# =============================================================================

[PARSER]
    Name         app_json
    Format       json

    # --- 타임스탬프: 앱이 찍은 시각을 그대로 써야 한다 (수집 시각 X) -----------
    # log-schema.md 의 @timestamp 예시: "2026-08-12T10:23:45.123Z" (UTC, ms, 'Z' 표기)
    #
    # Time_Key    : JSON 안에서 시간 값을 담고 있는 키. 스키마상 키 이름이 그대로 "@timestamp".
    # Time_Format : strptime 스타일 포맷.
    #   - %L 은 밀리초(fractional seconds) 전용 확장 포맷. Fluent Bit 4.x 문서의
    #     docker 파서 예시(`%Y-%m-%dT%H:%M:%S.%L%z`)와 동일한 조합을 사용한다.
    #   - %z 가 리터럴 'Z' 를 UTC(오프셋 0)로 인식하는지가 이 PoC에서 가장 불확실했던
    #     부분이라 Fluent Bit 소스(src/flb_strptime.c, v4.1.0 태그)를 직접 확인했다.
    #     %z 파싱 루프 안에 `case 'Z': ... flb_tm_gmtoff(tm) = 0; ...` 분기가 있어
    #     'Z' 한 글자를 오프셋 0(UTC)로 정확히 처리한다. 즉 %z 만으로 numeric offset
    #     (+0000 등)과 'Z' 표기를 모두 커버하므로 별도로 "%LZ" 로 고정할 필요가 없다.
    #     (근거: https://raw.githubusercontent.com/fluent/fluent-bit/v4.1.0/src/flb_strptime.c ,
    #      docker 기본 파서 예시: https://docs.fluentbit.io/manual/4.1/data-pipeline/parsers/configuring-parser)
    # Time_Keep   : On 이어야 파싱된 시각으로 레코드의 @timestamp(문서 필드)가 채워지고,
    #   그 값이 그대로 OpenSearch 문서의 실제 타임스탬프(및 Logstash_Format 인덱스 라우팅의
    #   기준 시각)로 쓰인다. Off 로 두면 Fluent Bit 이 "수집 시각"으로 덮어써 버려서
    #   요구사항 4번(앱이 찍은 값 그대로 사용)이 깨진다.
    Time_Key     @timestamp
    Time_Format  %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep    On
