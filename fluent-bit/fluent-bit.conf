# =============================================================================
# fluent-bit.conf
# -----------------------------------------------------------------------------
# 역할: docker fluentd 로깅 드라이버 → (Forward) → JSON 평탄화 → Docker 메타데이터
#       제거 → OpenSearch(HTTPS) 색인.
#
# 담당 범위는 이 파일 + parsers.conf 두 개뿐이다. docker-compose.yml, 인덱스 템플릿,
# 보안 스크립트는 다른 작업자가 별도로 다룬다.
#
# 로그 필드 스키마 근거: /Users/sunm2n/Desktop/Poc/monitoringPoc/docs/log-schema.md
# 이미지: fluent/fluent-bit:4.1 → 아래 옵션은 Fluent Bit 4.1 공식 문서 기준으로 검증했다.
# =============================================================================

[SERVICE]
    # Flush 1        : 1초마다 버퍼를 flush. PoC 규모에서는 지연보다 "빨리 눈으로
    #                  확인 가능"이 중요해서 짧게 잡는다.
    # Log_Level info  : PoC 단계라 Fluent Bit 자체 동작(파서 에러 등)을 눈으로 봐야 한다.
    #                  운영이라면 warning 이하로 낮추는 걸 고려.
    # Parsers_File    : 이 디렉터리에 함께 배치되는 parsers.conf 를 로드.
    #                  (실제 컨테이너 내 경로/마운트는 docker-compose 담당자 몫)
    # Daemon off      : 컨테이너 포그라운드 프로세스로 떠 있어야 하므로 반드시 off.
    #                  (on 이면 데몬화되어 컨테이너가 즉시 종료된 것처럼 보인다)
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf
    Daemon       off

# -----------------------------------------------------------------------------
# INPUT: docker fluentd 로깅 드라이버가 여기로 쏜다.
# api 컨테이너 쪽 driver 옵션: tag=poc.api, fluentd-async=true
# (fluentd-async: true → 수집기가 죽어도 앱 쓰기가 막히지 않음. 즉 이 파이프라인은
#  "유실 허용" 설계다. 감사로그가 여기로 오면 안 되는 이유이기도 함 — log-schema.md 6장 참조)
# -----------------------------------------------------------------------------
[INPUT]
    Name   forward
    Listen 0.0.0.0
    Port   24224

# -----------------------------------------------------------------------------
# FILTER 1/2: JSON 파싱 — 이 PoC에서 가장 흔한 실패 지점
# -----------------------------------------------------------------------------
# Docker fluentd 드라이버는 앱의 stdout 한 줄(JSON 문자열)을 그대로 감싸지 않고
# `{"log": "<원본 JSON 문자열>", "container_id": "...", ...}` 형태의 "문자열 값"으로
# 한 번 더 감싸서 보낸다. 즉 이 시점 레코드는 JSON이 아니라 "JSON을 값으로 가진 JSON"이다.
# 여기서 Key_Name log 를 다시 parsers.conf의 app_json 파서로 파싱해서 펼치지 않으면
# company_id, error.stack_trace 등 개별 필드가 전부 `log` 라는 하나의 문자열 안에 갇혀
# 있게 되어 DLS(company_id term 매칭)도, 대시보드 집계(event, http.status_code 등)도
# 전부 불가능해진다.
#
# Reserve_Data On   : log 필드를 파싱해서 나온 필드들 "외의" 원본 필드(container_id 등)를
#                     레코드에 남긴다. 이게 없으면 파싱 결과만 남고 나머지가 전부 사라져서
#                     바로 다음 FILTER(record_modifier)가 지울 대상 자체가 없어진다.
# Preserve_Key      : 요구사항 2번(파싱 후 log 원본 키가 남으면 안 됨)과 직결되는 옵션인데,
#                     일부러 넣지 않았다. Fluent Bit 4.1 parser 필터 문서 기준
#                     Preserve_Key 의 기본값은 Off이고, "Off일 때 원본 Key_Name 필드(log)는
#                     결과에서 제거된다"가 명시된 동작이다. Reserve_Data 는 log **이외의**
#                     필드 보존 여부만 제어하고 log 자체의 보존 여부는 Preserve_Key 가 별도로
#                     제어한다. 즉 Reserve_Data On + Preserve_Key(미설정=Off) 조합이면
#                     "다른 필드는 남기고 log 원본은 지운다"가 정확히 기본 동작이므로
#                     record_modifier 로 log 를 별도로 지울 필요가 없다.
#                     (근거: https://docs.fluentbit.io/manual/data-pipeline/filters/parser.md)
[FILTER]
    Name     parser
    Match    poc.api
    Key_Name log
    Parser   app_json
    Reserve_Data On

# -----------------------------------------------------------------------------
# FILTER 2/2: Docker가 붙인 메타데이터 제거
# -----------------------------------------------------------------------------
# 위 parser 필터를 거치고 나면 레코드에는 (a) app_json 이 펼친 log-schema.md 필드들과
# (b) fluentd 드라이버가 원래 record 최상위에 붙여 놓은 Docker 메타데이터가 섞여 있다.
# (b)는 log-schema.md 에 정의되지 않은 필드라서 그대로 두면:
#   - 인덱스 템플릿에 정의 안 된 필드가 동적 매핑으로 들어가 스키마가 오염되거나
#   - dynamic:strict 설정이면 색인 자체가 거부될 수 있다.
# 그래서 스키마에 없는 필드는 전부 명시적으로 제거한다.
#
#   container_id     : 컨테이너 해시. 이 스키마엔 대응 필드 없음 → 제거.
#   container_name   : 스키마상 service(=poc-api, 고정값)가 이미 서비스 식별 역할을 한다.
#                       컨테이너 이름은 "docker-compose가 붙이는 인스턴스 식별자"일 뿐이라
#                       DLS/FLS/집계 어디에도 쓰이지 않으므로 남겨둘 근거가 없어 제거한다.
#                       (남기고 싶다면 index template에 keyword로 명시 매핑하고 이 줄만
#                       빼면 됨 — 지금은 "필요 없으면 지운다" 원칙에 맞춰 제거)
#   source           : stdout/stderr 구분자. 앱은 stdout에만 JSON 한 줄을 쓰므로
#                       (log-schema.md 1장) 이 값은 컨테이너 내내 "stdout" 고정이라
#                       정보량이 0 → 제거.
#   partial_message  : Docker 로그 한 줄이 드라이버 버퍼보다 커서 여러 청크로 쪼개졌을 때
#   partial_id       : 붙는 필드들. log-schema.md 6장 규칙("스택트레이스는 JSON 문자열 안에
#   partial_ordinal  : 개행 이스케이프로 담는다")을 지키면 한 줄짜리 JSON이 쪼개질 일은
#   partial_last     : 없어야 정상이지만, 혹시 발생해도 스키마 밖 필드이므로 제거 대상.
[FILTER]
    Name       record_modifier
    Match      poc.api
    Remove_key container_id
    Remove_key container_name
    Remove_key source
    Remove_key partial_message
    Remove_key partial_id
    Remove_key partial_ordinal
    Remove_key partial_last

# -----------------------------------------------------------------------------
# OUTPUT: OpenSearch 3.1 (HTTPS, self-signed)
# -----------------------------------------------------------------------------
# Host/Port          : docker-compose 상의 opensearch 컨테이너 이름/포트 (9200).
# HTTP_User/Passwd    : admin / ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}.
#                       비밀번호를 파일에 하드코딩하지 않고 컨테이너 환경변수를
#                       ${VAR} 문법으로 참조 (Fluent Bit classic mode 는 이 문법을
#                       기동 시 그대로 치환한다).
#                       근거: https://docs.fluentbit.io/manual/administration/configuring-fluent-bit/classic-mode/variables.md
# Logstash_Format On +
# Logstash_Prefix app-logs
#                     : 인덱스명을 app-logs-YYYY.MM.DD 형태로 자동 생성한다.
#                       Logstash_DateFormat 기본값이 %Y.%m.%d 라서(Elasticsearch 출력
#                       플러그인과 동일 옵션을 OpenSearch 출력 플러그인도 그대로 상속)
#                       별도로 지정하지 않아도 요구된 포맷이 나온다. Logstash_Format On일
#                       때는 Index 옵션이 무시되므로 Index는 별도로 설정하지 않았다.
# Suppress_Type_Name On
#                     : OpenSearch 2.0+/3.x 는 매핑 타입(_doc 등)을 더 이상 쓰지 않는다.
#                       켜지 않으면 색인 요청에 타입이 섞여 들어가 색인이 실패할 수 있다.
# tls On / tls.verify Off
#                     : OpenSearch가 HTTPS + self-signed 인증서를 쓰므로 tls는 켜되,
#                       PoC 환경이라 CA 체인이 없어 검증은 끈다. (운영 전환 시 CA를
#                       tls.ca_file 로 넣고 tls.verify On 으로 바꿔야 함 — 지금은 의도적으로 Off)
# Trace_Error On      : 색인 실패 시 OpenSearch가 돌려주는 에러 본문을 로그에 그대로
#                       남긴다. 이게 없으면 "왜 색인이 안 됐는지"가 안 보여서 이 PoC의
#                       목적(스키마 검증)과 정면으로 배치된다.
# Replace_Dots 미설정  : 요구사항에 따라 필드명을 훼손할 수 있는 옵션은 켜지 않는다.
#                       log-schema.md 의 http.method 같은 점(.) 표기는 애초에 중첩 객체
#                       (http: {method: ...})로 오므로 Replace_Dots(점→언더스코어 치환)가
#                       필요한 상황 자체가 아니다. 켜면 오히려 필드 구조가 스키마 문서와
#                       달라져 index template(opensearch/01-index-template.json)과
#                       어긋난다.
[OUTPUT]
    Name    opensearch
    Match   poc.api
    Host    opensearch
    Port    9200
    HTTP_User    admin
    HTTP_Passwd  ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    Logstash_Format On
    Logstash_Prefix  app-logs
    Suppress_Type_Name On
    tls          On
    tls.verify   Off
    Trace_Error  On
