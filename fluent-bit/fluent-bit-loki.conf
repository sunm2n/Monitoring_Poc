# =============================================================================
# fluent-bit-loki.conf — OpenSearch + Loki 동시 전송 설정
# -----------------------------------------------------------------------------
# 이 파일은 fluent-bit.conf 를 통째로 include 하고 Loki OUTPUT 하나만 덧붙인다.
#
# 왜 이렇게 하는가:
#   비교의 공정성 때문이다. INPUT(forward), JSON 파싱, 메타데이터 제거가 모두
#   같은 설정을 공유하므로 두 백엔드는 **바이트 단위로 동일한 레코드**를 받는다.
#   설정을 따로 두면 "Loki 쪽이 더 느리다/필드가 다르다"가 백엔드 차이인지
#   설정 차이인지 구분할 수 없게 된다.
#
# 사용:
#   docker compose -f docker-compose.yml -f docker-compose.loki.yml up -d
#
# Fluent Bit 은 Match 가 겹치는 OUTPUT 전부로 레코드를 복사해 보낸다.
# 따라서 poc.api 태그 하나가 OpenSearch 와 Loki 양쪽으로 fan-out 된다.
# =============================================================================

@INCLUDE fluent-bit.conf

# -----------------------------------------------------------------------------
# OUTPUT: Loki
# -----------------------------------------------------------------------------
# ★ 라벨 설계가 Loki 의 전부다. OpenSearch 와 사고방식이 근본적으로 다르다.
#
#   OpenSearch : 모든 필드를 역색인한다 → 아무 필드로나 검색·집계가 된다
#   Loki       : **라벨만** 색인한다 → 라벨 조합이 곧 스트림이고, 본문은 통째 압축 저장
#
# 그래서 라벨에 무엇을 넣느냐가 성능과 비용을 좌우한다.
#
# 라벨로 넣은 것 (카디널리티가 낮고 유한한 것만):
#   service    : 고정값 1개
#   env        : 고정값 1개
#   level      : Information / Warning / Error → 3개
#   company_id : 회사 수만큼. PoC 는 2개 (실제 제품이라면 고객사 수 = 수십~수백)
#
# ⚠️ 라벨로 넣지 않은 것 — 넣으면 Loki 가 죽는다:
#   trace_id   : 요청마다 유일 → 스트림이 무한히 늘어난다 (카디널리티 폭발)
#   user_id    : 사용자 수만큼
#   http.path  : 경로에 ID가 박히면(/api/products/12/purchase) 사실상 무한
#
#   이 값들은 라벨 대신 로그 본문(JSON)에 남아 있고, 조회할 때 LogQL 의 `| json`
#   으로 파싱해서 필터링한다. 색인이 안 되어 있으니 전체 스캔이지만,
#   시간 범위 + 라벨로 먼저 좁힌 뒤라면 실용적인 속도가 나온다.
#
#   → company_id 를 라벨에 넣을 수 있는 것은 "회사 수는 유한하다"는 도메인 지식 덕분이다.
#     이 판단이 틀리면(예: 라벨에 사용자 ID를 넣으면) 운영 중에 Loki 가 무너진다.
#     OpenSearch 에는 이런 종류의 사전 판단이 필요 없었다 — 그게 비용의 대가다.
#
# line_format json : 레코드 전체를 JSON 한 줄로 보낸다.
#                    우리 로그가 이미 JSON 스키마라서 LogQL `| json` 이 그대로 먹는다.
#                    key_value 로 두면 중첩 객체(http, error)가 뭉개진다.
#
# labels 에 쓴 $field 는 Fluent Bit 의 record accessor 문법으로, 레코드의 해당
# 필드 값을 라벨 값으로 꺼내온다. 필드가 없으면 그 라벨은 붙지 않는다.
#
# tenant_id 를 쓰지 않는 이유:
#   Loki 는 X-Scope-OrgID 헤더로 테넌트를 나눌 수 있지만, "누가 어느 테넌트를
#   볼 수 있는가"를 강제하는 인증 계층이 Loki 안에 없다. 헤더를 붙여주는 프록시를
#   직접 만들어야 하고 그 프록시가 뚫리면 격리도 함께 뚫린다.
#   PoC 에서는 이 한계를 감추지 않기 위해 단일 테넌트로 두고,
#   "Grafana 의 company_id 필터는 권한이 아니라 화면 필터일 뿐"임을 그대로 보여준다.
#   자세한 비교는 ../docs/loki-comparison.md 참조.
[OUTPUT]
    Name        loki
    Match       poc.api
    Host        loki
    Port        3100
    labels      job=fluent-bit, service=$service, env=$env, level=$level, company_id=$company_id
    line_format json
    Retry_Limit 3
